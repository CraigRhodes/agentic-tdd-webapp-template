name: E2E

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR supersedes the running gate; main always runs
# to completion so every landed commit has a full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28" # pinned like pnpm (packageManager) — a uv release can't change CI under a PR
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked # like pnpm's --frozen-lockfile — a stale uv.lock fails instead of silently re-locking
        working-directory: backend
      - uses: pnpm/action-setup@v6 # version comes from package.json's packageManager field
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - uses: actions/cache@v6 # skips the browser download when the lockfile (and so the Playwright version) is unchanged
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
