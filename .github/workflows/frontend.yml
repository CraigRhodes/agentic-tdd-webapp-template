name: Frontend

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR supersedes the running gate; main always runs
# to completion so every landed commit has a full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json's packageManager field
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # regenerates routeTree.gen.ts, then tsc --noEmit
      - run: git diff --exit-code -- src/routeTree.gen.ts # committed route tree must match the routes
      - run: pnpm lint # Biome lint + format check (biome.jsonc)
      - run: pnpm test
      - run: pnpm depcruise # import-boundary fence (.dependency-cruiser.cjs)
      - run: pnpm build-storybook # broken stories fail CI
