name: Backend

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR supersedes the running gate; main always runs
# to completion so every landed commit has a full CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28" # pinned like pnpm (packageManager) — a uv release can't change CI under a PR
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked # like pnpm's --frozen-lockfile — a stale uv.lock fails instead of silently re-locking
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
