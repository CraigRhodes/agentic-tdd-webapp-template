# Keeps the template (and products cut from it) from aging between adoptions:
# the full CI gate on every PR is what makes automated bumps safe to merge.
# Updates arrive as one grouped PR per ecosystem per week — review noise stays
# proportional to the human attention available, and a failing gate on a group
# names exactly which ecosystem's bump needs a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # @types/node majors track Node majors; stay in lockstep with the Node
      # version pinned in .nvmrc/engines — lift this when bumping Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # dependency-cruiser supports typescript <7; a newer major kills the
      # import fence (depcruise cruises 0 modules and the gate fails). Lift
      # when dependency-cruiser supports the new typescript major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
