[project]
name = "app"
version = "0.1.0"
description = "Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test basenames repeat across domain dirs — the layout
# docs/architecture.md prescribes (tests/unit/<domain>/test_service.py per
# domain) collides under the default prepend mode from the second domain on.
addopts = ["--import-mode=importlib"]
markers = [
    "integration: exercises a real server; deselect with -m 'not integration'",
]
filterwarnings = [
    # Warnings fail the suite so deprecations surface when introduced, not
    # when they break. Silence third-party noise with a targeted ignore here.
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
